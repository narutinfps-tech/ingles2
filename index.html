<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <!-- Preconnect and DNS prefetch to speed up Wistia video load times -->
    <link rel="preconnect" href="https://fast.wistia.net" crossorigin />
    <link rel="preconnect" href="https://fast.wistia.com" crossorigin />
    <link rel="preconnect" href="https://embed-ssl.wistia.com" crossorigin />
    <link rel="dns-prefetch" href="https://fast.wistia.net" />
    <link rel="dns-prefetch" href="https://fast.wistia.com" />
    <link rel="dns-prefetch" href="https://embed-ssl.wistia.com" />
    
    <!-- Fast-load Wistia player engine asynchronously -->
    <script src="https://fast.wistia.com/assets/external/E-v1.js" async></script>

    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>
    <script>
      window.pixelId = "6a0a3b5b75387661c8272ba7";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
